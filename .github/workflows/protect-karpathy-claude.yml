name: Protect immutable Karpathy CLAUDE rules

on:
  push:
  pull_request:

jobs:
  verify-karpathy-block:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable Karpathy block
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          expected = "694a2d721e41c385f3db492838c23299826df5ba9809e3b0721aac70021e196a"
          text = Path("CLAUDE.md").read_text(encoding="utf-8")
          begin = "<!-- BEGIN IMMUTABLE KARPATHY GUIDELINES -->\n"
          end = "<!-- END IMMUTABLE KARPATHY GUIDELINES -->"

          if begin not in text or end not in text:
              raise SystemExit("Immutable Karpathy markers are missing from CLAUDE.md")

          block = text.split(begin, 1)[1].split(end, 1)[0]
          actual = hashlib.sha256(block.encode("utf-8")).hexdigest()

          if actual != expected:
              raise SystemExit(
                  "Immutable Karpathy CLAUDE rules were modified. "
                  "Restore CLAUDE.md and put project-specific rules in PROJECT_RULES.md."
              )

          print("Immutable Karpathy CLAUDE rules verified.")
          PY
