# 공통 영상 기획 공정 정의.
# 특정 편의 내용은 이 파일이 소유하지 않는다. 현재 사실·편별 잠금은 owner 문서와 lock 파일이 소유한다.
# 실제 실행 상태는 tools/harness/STATE.json 이 owner다.
# 이 공정은 "좋은 기획을 보장"하는 장치가 아니라, 실제 재료·경쟁 근거·후보 경쟁을 빠뜨리지 않고
# GPT/Claude/Codex가 같은 순서로 기획하도록 하는 공통 core다.

공정: video_planning
정의_상태: ACTIVE
기준일: 2026-09-04

핵심_원칙:
  - 실제 재료가 있으면 상상한 원안보다 실제 재료를 먼저 본다.
  - 외부 원작·경기·공연·사건처럼 자체 서사가 있는 재료는 그 source narrative를 골격으로 복원하고, 분석 주제와 출연자 반응은 그 골격 안에서 결합한다.
  - A/B→C는 콘텐츠의 큰 뼈대이며 경쟁 영상 분석이 이를 대체하지 않는다.
  - 윤성원 PD 전사에서 채택된 기획 원칙은 참고문헌으로만 두지 않고, 해당 의사결정 단계의 공통 체크포인트로 실행한다.
  - 성공 사례를 복제하지 않고 현재 재료에 적용 가능한 구조 원리만 추출한다.
  - 단일 원안을 만든 뒤 자기검증하는 것을 기본값으로 두지 않는다. 서로 다른 콘텐츠 각 후보를 경쟁시킨다.
  - RED TEAM PASS를 기획 품질 인증으로 취급하지 않는다.
  - AI/harness가 전문 기획 판단을 먼저 책임지고, 사용자는 실제 review rough cut을 본 일반 시청자의 체감 관측과 최종 제작 의사결정을 맡는다.
  - 장기 Phase 로드맵은 한 편 자체의 재미보다 상위에 두지 않는다.
  - 새 규칙·새 agent·새 framework를 늘리는 것을 기본 해결책으로 삼지 않는다.

입력_분기:
  material_first:
    조건: 실제 촬영물·실험 결과·관찰 기록 등 현재 편에 사용할 실재료가 이미 있다.
    시작: source reconstruction과 synchronized evidence timeline
  pre_shoot:
    조건: 사용할 실재료가 아직 없고 촬영·실험 전 기획이 필요하다.
    시작: A/B→C와 촬영 가능한 조건·제약

단계:
  - 번호: 1
    이름: current truth 복원·잠금
    하는_일:
      - STATE.md와 요청에 필요한 owner 문서에서 현재 사실·목표·제약을 복원한다.
      - 편별 lock이 있으면 확정된 A/B와 확보·미확보 자료 경계를 유지한다.
      - 장기 로드맵은 PROJECT_CONTEXT.md에서 확인하되 개별 영상의 재미를 희생시키는 명령으로 사용하지 않는다.
    통과_조건:
      - 현재 사실과 과거/가정이 분리돼 있다.
      - 이미 확정된 내용을 다시 설계 대상으로 돌리지 않는다.
    판정자: AI

  - 번호: 2
    이름: 입력 경로 선택
    하는_일: 실제 재료 존재 여부로 material_first / pre_shoot 중 하나를 선택한다.
    통과_조건:
      - 실제 재료가 있는데 pre_shoot 가상 원안부터 만들지 않는다.
      - 선택 이유를 현재 owner 근거로 설명할 수 있다.
    판정자: AI

  - 번호: 3
    이름: 재료 또는 촬영 전 기반 정리
    경로:
      material_first:
        하는_일:
          - 외부 source narrative가 있는 영상은 후보 경쟁 전에 네 독립 layer를 복원한다: A source narrative, B desktop dialogue/audio, C user mic raw, D visual/nonverbal reaction.
          - Layer A는 접근 가능한 공식·신뢰 가능한 synopsis/subtitle/script와 실제 화면·desktop audio를 대조해 source TC별 사건, 관계 변화, 감정 변화, 앞뒤 의존 정보, narrative function을 기록한다. 저작권 텍스트 전체를 저장소에 복제하지 않는다.
          - 각 narrative beat는 청해·반응의 세기와 독립적으로 `MUST_KEEP / BRIDGE / OPTIONAL` 중요도를 판정한다. 인과·관계·climax·resolution·emotional closure 또는 다음 반응의 이유가 사라지면 MUST_KEEP/BRIDGE다.
          - Layer B/C는 가능한 최고 정확도의 분리 전사를 absolute source TC, chunk overlap, raw/interpretation 분리, uncertainty와 함께 만든다. 사용자의 오청·오발음·code-switch를 정답 표현으로 교정하지 않는다.
          - Layer D의 웃음·표정·놀람·침묵·몰입·따라 하기는 transcript만으로 확정하지 않고 실제 video evidence로 확인한다.
          - 네 layer를 absolute TC로 정렬한 synchronized evidence timeline을 만든 뒤에만 scene candidate 경쟁으로 이동한다.
          - 기존 select나 분석표는 새 source reconstruction을 덮어쓰지 않으며, recovery 시 historical evidence로만 사용할 수 있다.
          - 텍스트·수치·휴리스틱은 탐색용으로만 쓰고 후보의 힘과 동일 기능 반복은 필요한 원본 시청각 정보로 확인한다.
          - 촬영 전 기획보다 실제 푸티지가 우선하며, 예상과 다르면 푸티지 안에서 새 콘텐츠 각과 핵심 장면을 다시 찾는다.
        통과_조건:
          - 외부 source narrative가 있으면 A/B/C/D 네 layer, narrative map, synchronized evidence timeline이 준비돼 있다.
          - MUST_KEEP/BRIDGE가 분석 주제와 독립적으로 판정돼 있고, 불확실한 전사·해석·시각 관측이 확정 사실과 분리돼 있다.
          - 네 layer가 준비되기 전에 최종 scene candidate 경쟁으로 수렴하지 않는다.
      pre_shoot:
        하는_일:
          - A(누가) / B(무엇을 한다) / C(시청 후 남을 감상)를 잠정적으로 명료화한다.
          - 결과를 사실처럼 예측하지 않고 성공·실패 어느 쪽에서도 영상이 성립할 촬영 조건을 정리한다.
        통과_조건:
          - A/B→C와 실제 촬영·실험 조건이 구분돼 있다.
    판정자: AI

  - 번호: 4
    이름: 경쟁 영상 해부
    하는_일:
      - 현재 영상과 같은 전달 문제를 해결한 성공 사례와 약한 사례를 웹에서 찾는다.
      - 일본어 채널에 한정하지 않고 구조적으로 유사한 리액션·챌린지·자기실험·게임·요리·피트니스·다큐·브이로그 등을 포함할 수 있다.
      - 각 사례에서 아래 항목을 해부한다.
    해부_항목:
      - Promise: 제목·썸네일이 무엇을 약속했는가
      - Opening: 첫 30~60초에 무엇을 실제로 보여줬는가
      - Viewer_Question: 시청자가 무엇의 답을 기다리게 됐는가
      - Escalation: 중간마다 무엇이 새로 생겼는가
      - Variation: 반복될 수 있는 구간을 어떻게 변주했는가
      - Character: 출연자의 성격이 어떤 사건에서 드러났는가
      - Payoff: 가장 기다린 보상을 무엇으로 줬는가
      - Packaging_Fit: 제목·썸네일의 약속과 실제 payoff가 맞는가
      - Exit_Hook: 끝난 뒤 왜 다음 영상을 보고 싶게 되는가
      - Failure_Pattern: 유사하지만 약한 영상은 어디에서 무너졌는가
    산출물:
      - 채택한 각 구조 원리와 피할 Failure Pattern을 기록한다.
      - 각 원리마다 후속 단계가 확인할 `적용 대상 narrative beat/scene → 바꿔야 할 selection·구조·boundary → 검증할 결과`를 application contract로 남긴다.
    통과_조건:
      - 단순 조회수 나열이 아니라 적용 가능한 구조 원리와 피해야 할 실패 패턴이 남아 있다.
      - 외부 사실·성과 수치가 판단에 쓰이면 출처를 확인한다.
      - application contract가 없어 후속 단계가 구조 원리를 실제 결정에 대조할 수 없으면 통과하지 않는다.
    판정자: AI

  - 번호: 5
    이름: 콘텐츠 각 후보 생성
    하는_일:
      - 현재 재료/조건과 경쟁 사례에서 추출한 원리를 결합해 서로 다른 콘텐츠 각 후보를 만든다.
      - 외부 source narrative가 있으면 콘텐츠 각보다 먼저 narrative spine을 만든다. 각 beat는 사건, 앞뒤 인과, 관계·목표·위험·감정의 변화, 이미 본 시청자가 작품 흐름을 기억할 수 있는지, 장면 자체의 시청 가치를 기록한다.
      - 판단 우선순위는 `source narrative → 그 위의 A/B→C → 장면 재미·감정·관계 변화·명장면성·reaction → listening/reading evidence`다. source narrative와 A/B→C가 충돌하면 source narrative를 우선한다.
      - material_first의 scene 기본 단위는 분석용 핵심 문장 하나가 아니라 가능한 범위에서 `source setup → 필요한 작품 사건/대사 → 사용자 발언·이해·오해 → 실제 reaction → 자연스러운 완료/다음 상태`를 잇는다.
      - scene 역할은 현재 영상에 필요한 narrative·action·reaction·evidence·bridge 등의 실제 기여로 기록한다. 특정 편에서 쓴 역할 taxonomy를 모든 영상의 필수 분류로 강제하지 않으며, evidence나 character 기능만으로 본편 spine을 만들지 않는다.
      - 각 후보마다 `이 영상이 존재하는 이유가 되는 핵심 장면`을 명시한다. 핵심 장면이 없는 후보는 각이 아니라 주제/설명안으로 본다.
      - 후보 수를 고정하지 않고, 같은 아이디어의 문구 변형은 별도 후보로 세지 않는다.
      - material_first에서는 실제 사건이 없는 각을 억지로 만들지 않는다.
    각_후보에_포함:
      - A+B가 특별해지는 이유
      - 시청자가 남길 C
      - 이 영상이 달려갈 핵심 장면 / 콘텐츠 각
      - 실제 사건·장면 또는 촬영 전 발생 구조
      - 클릭 이유
      - 예상 댓글 / 커뮤니티에 퍼갈 문구
      - 캡처·짧은 대사·표정 등 영상 밖에서 재가공될 공유 단위 후보
      - 핵심 payoff
      - 다음 상태·다음 궁금증
      - Step 4 application contract 중 실제로 적용한 원리와 적용하지 않은 원리의 이유
    통과_조건:
      - 서로 기능이 다른 유효 후보가 둘 이상 있거나, 하나만 성립한다면 다른 후보가 왜 성립하지 않는지 근거가 있다.
      - 외부 source narrative가 있으면 모든 후보가 같은 검증된 narrative spine 위에서 비교된다.
    판정자: AI

  - 번호: 6
    이름: 후보 경쟁·최종 각 선택
    하는_일: 후보를 아래 축으로 비교하고 약한 후보를 제거한 뒤 최종 각 하나를 선택한다.
    비교_축:
      - A+B의 힘
      - C가 설명이 아니라 시청 경험에서 생기는가
      - "`나라면 왜 보나`가 답되는가 / 일본어·애니에 원래 관심이 없는 인접 시청자까지 입구를 넓힐 사건·질문이 있는가"
      - 영상이 달려갈 핵심 장면이 실제 재료 안에 있는가
      - 실제 사건·장면 근거
      - 클릭 이유
      - 첫 구간에서 보여줄 것
      - 중간 시청 이유 갱신
      - 동일 기능 반복 위험
      - 사용자라는 인물의 기억성
      - payoff
      - 정직하면서 강한 패키징 가능성
      - 예상 댓글·커뮤니티 제목·공유 단위가 구체적으로 떠오르는가
      - 다음 상태·후속 시청 욕구
      - 장기 Phase와의 자연스러운 연결
      - 제작 가능성
      - narrative spine coverage와 사건 자체의 시청 가치
      - Step 4 application contract를 실제 selection/DROP 판단으로 이행했는가
    통과_조건:
      - 최종 선택 이유와 탈락 이유를 설명할 수 있다.
      - 장기 로드맵 적합성만으로 한 편 자체가 약한 후보를 승격하지 않는다.
      - "`경쟁 영상을 참고했다`가 아니라 `구조 원리 → narrative beat/scene → 변경된 RETAIN·ALTERNATE·DROP 또는 boundary → 회피한 Failure Pattern`의 application trace가 있다."
    판정자: AI

  - 번호: 7
    이름: 본편 구조·payoff 설계
    하는_일:
      - 선택된 각과 핵심 장면을 중심으로 실제 장면/행동의 순서를 설계한다.
      - Cold open보다 본편을 먼저 설계한다.
      - 외부 source narrative가 있으면 narrative spine의 사건·인과·관계·목표·위험·감정 변화를 먼저 body에 배치하고, 그 위에 A/B→C와 reaction/evidence를 얹는다. evidence를 먼저 배열하지 않는다.
      - "`무엇을 넣을지`와 `어떻게 조합할지`를 분리해서 판단하고, 핵심 장면까지의 빌드업을 약하게 하는 재미있는 B컷도 버릴 수 있다."
      - material_first에서는 chronology integrity와 narrative continuity를 별도로 검사한다. chronology integrity는 남긴 사건의 순서를 뒤집지 않는 것이고, narrative continuity는 상황·관계·질문·감정·인과가 컷 사이에서 이유 없이 사라지지 않는 것이다.
      - 모든 큰 cut boundary에서 setup, 발화, 행동과 reaction이 각각 필요한 만큼 완료됐는지 확인한다.
      - prior-scene lead-in이 필요한지, 줄인 scene과 next scene을 실제로 이어 봤을 때 causal·emotional·rhythm distortion이 생기는지 확인한다.
      - source clip 단독 완결성뿐 아니라 assembled adjacency에서 자연스러운 최소 충분 범위를 선택한다.
      - 압축 때문에 사용자가 처음부터 이해한 것처럼 보이거나 reaction의 실제 원인이 바뀌지 않는지 확인한다.
      - review boundary는 필요한 setup, 작품 사건·대사, 사용자 발언, reaction과 자연스러운 완료를 보존한다. 말 중간, 문장 끝 직전, 행동·reaction 진행 중 절단은 금지한다.
      - MUST_KEEP를 청해·반응이 약하다는 이유로 제거하지 않고, BRIDGE는 다음 핵심 장면의 의미가 보존되는 최소 길이로 설계한다.
      - 각 주요 구간에서 시청자의 기대·질문·판단이 어떻게 바뀌는지 확인한다.
      - 화면이 이미 말하는 내용을 나레이션으로 반복하지 않는다.
    통과_조건:
      - 초반 이후에도 볼 이유가 갱신된다.
      - 각 구간이 최종 핵심 장면·C·payoff 중 적어도 하나를 향해 전진한다.
      - 같은 기능의 사건을 기계적으로 반복하지 않는다.
      - payoff가 영상 전체의 약속과 연결된다.
      - C가 마지막 설명문 하나에 의존하지 않는다.
      - 외부 source narrative가 있으면 작품 자체를 따라가며 즐기는 경험이 분석표·진단표보다 먼저 유지된다.
      - Step 4 application trace가 각 주요 beat의 구조 기능과 boundary 결정에 연결돼 있다.
    판정자: AI

  - 번호: 8
    이름: 패키징
    하는_일:
      - 본편 구조와 payoff가 정해진 뒤 제목·썸네일·Cold open 약속을 만든다.
      - 제목·썸네일은 핵심 장면·C·payoff에서 역산하고, 커뮤니티에서 재가공될 때 붙을 법한 제목/한 문장을 별도 점검한다.
      - Cold open은 `결과를 감추는가`가 아니라 제목·썸네일 promise를 빠르게 확인시키고도 미해결 질문을 남기는가로 평가한다.
      - 첫 구간에서 title/thumbnail promise 또는 즉시 볼 가치가 실제 footage로 드러나는지 확인한다.
      - 첫 구간 뒤에도 이후 결과·변화·관계·원인 중 무엇이 풀리지 않아 계속 볼 이유가 생기는지 확인한다.
      - 하나의 complete event라는 사실만으로 Opening을 통과시키지 않는다.
      - 첫 구간이 promise를 자체적으로 닫거나 다음 질문을 만들지 못하거나 사전 설명이 있어야 가치가 생기면 Opening 후보를 재경쟁한다.
      - Cold open에서 body scene을 먼저 보여주면 본편 재등장에는 더 큰 맥락, 원인/결과, 새 정보, 새 감정, payoff, 의미 재해석 중 하나 이상이 추가돼야 한다. 없으면 teaser/body 한쪽에서 제거한다.
      - 실제 결과와 재료보다 세게 약속하지 않는다.
    통과_조건:
      - 제목·썸네일의 핵심 약속이 첫 구간과 payoff에서 실제로 회수된다.
      - 첫 구간 자체의 가치와 이후에 남는 Viewer Question을 실제 footage 근거로 설명할 수 있다.
      - 콘텐츠 각 선택 전에 패키징이 기획을 끌고 가지 않는다.
      - Cold open/body의 동일 대사·reaction이 새 의미 없이 단순 반복되지 않는다.
    판정자: AI

  - 번호: 9
    이름: AI 전문 기획 판정
    하는_일:
      - deterministic validator로 current truth·lock·자료 경계 같은 기계 검사를 수행한다. lock은 `tools/harness/STATE.json`의 `현재_lock`을 기본값으로 사용한다.
      - 그 뒤 AI가 실제 장면 근거와 구조표를 대조해 아래 전문_평가_축을 먼저 판정하고, 약점과 rough cut용 최소 조정을 기록한다.
      - RED TEAM으로 약속/본편 불일치, 초반 이후 견인, 반복, C, 인물성, 핵심 장면의 힘, 타겟 확장성, 공유 단위, payoff, 후속 욕구를 공격한다.
      - RED TEAM은 품질 인증이 아니라 명백한 약점을 찾는 마지막 공격이다.
      - Step 4 application contract와 Step 5~7 application trace를 실제 selected footage에 대조한다. 축 이름만 반복하고 selection·DROP·boundary 변화가 없으면 FAIL이다.
      - application trace가 존재한다는 사실을 viewer-facing Opening 성공의 증거로 사용하지 않는다. Opening의 최종 성공 여부는 실제 pilot 또는 full rough-cut UAT로 검증한다.
    전문_평가_축:
      - A/B→C 연결
      - Promise
      - Opening
      - Viewer Question
      - Escalation
      - Variation
      - Character
      - Payoff
      - Packaging Fit
      - Exit Hook
      - 동일 기능 반복
      - chronology integrity
      - narrative continuity
      - MUST_KEEP narrative coverage
      - 사실 경계
      - 장면 간 낙차
      - 시청자의 판단이 구간마다 갱신되는지
      - 핵심 장면까지 볼 이유가 유지되는지
      - competitive application trace가 실제 selection/body에 강제됐는지
    render_금지_gate:
      - MUST_KEEP narrative beat가 누락됐다.
      - climax, resolution, emotional closure가 근거 없이 삭제됐다.
      - cut boundary에서 narrative continuity가 끊기거나 reaction의 원인이 잘렸다.
      - 동일 기능의 장면이 반복되면서 escalation·variation·narrative progress·character change·payoff 중 새로운 기여가 없다.
      - 작품 감상보다 analysis tag 순서가 편집을 지배한다.
      - Cold open과 body가 새 맥락·원인/결과·정보·감정·payoff·재해석 없이 같은 대사나 reaction을 단순 반복한다.
      - 동일 reaction/listening 기능이 반복되거나 scene context 절단으로 원본 의미가 달라진다.
      - A/B→C 증명을 최적화하는 과정에서 source narrative 감상 자체가 무너진다.
      - 경쟁 분석의 구조 원리와 Failure Pattern이 application trace 없이 평가축 이름으로만 남아 있다.
      - 대사·문장·행동·reaction이 완료되기 전에 boundary가 끊긴다.
    통과_조건:
      - deterministic 검사 PASS.
      - render_금지_gate가 모두 PASS다. 하나라도 FAIL이면 review rough cut으로 넘기지 않고 구조와 evidence를 수리한 뒤 재검증한다.
      - 각 전문 평가축의 근거, 남은 위험, rough cut에서 확인할 가설이 기록돼 있다.
      - 외부 source narrative가 있으면 narrative spine과 competitive application trace가 selected footage에 대해 검증됐다.
      - 같은 AI의 RED TEAM PASS만으로 "좋은 기획"이라고 선언하지 않는다.
      - 사용자에게 문서만 읽고 완성 영상의 호흡·지루함·payoff를 전문적으로 시뮬레이션하라고 요구하지 않는다.
    판정자: validator + AI/harness

  - 번호: 10
    이름: review rough cut·시청 테스트·최종 판정
    순서:
      - 단계: review rough cut 생성
        하는_일:
          - AI 전문 기획 판정을 통과한 실제 selected footage를 이어 붙여 시청 가능한 review rough cut을 만든다.
          - 이 artifact는 최종 편집물이 아니며, 예쁜 자막·효과·음악이 아니라 실제 장면 순서·호흡·길이·payoff를 체험하는 데 목적이 있다.
          - Cold open만 chronology 예외로 허용하고 본편 chronology를 보존한다.
          - 재확인·재시청·재촬영 여부는 내부 material provenance와 분석 기록에 보존하되 viewer-facing 영상에 표시를 강제하지 않는다.
          - 촬영 세션 provenance overlay 없이 장면을 자연스럽게 사용할 수 있다. 다만 최초 반응이 아닌 장면을 `첫 반응`, `처음 본 순간`, `처음 보는 장면`이라고 명시적으로 주장하지 않는다.
          - source TC 같은 검수용 overlay도 일반 시청 몰입을 방해하면 review artifact에서 제거한다.
          - 원본 의미를 바꾸거나 확보되지 않은 사실·나레이션을 만들지 않는다.
      - 단계: 사용자 시청 테스트
        하는_일:
          - 사용자는 문서나 전문 용어로 기획을 분석하지 않고 실제 rough cut을 일반 시청자 모드로 본다.
          - 정확한 이탈 충동 시점, 집중이 오른 시점, 이해가 막힌 곳, 반복처럼 느낀 곳, 기억에 남은 장면, 직후 남은 한 문장·감상, 다음 영상과 같은 채널 영상의 재시청 의향을 체감 관측으로 남긴다.
          - "`C가 구조적으로 형성됐는가`, `payoff 설계가 충분한가` 같은 전문 판단 질문을 사용자에게 하지 않는다."
      - 단계: AI 사후 해석
        하는_일:
          - AI가 사용자의 체감 관측을 타임코드와 장면 근거에 연결하고 viewer question 단절, 동일 기능 반복, payoff 약화, setup 과다, character 부족, promise mismatch 등 구조 원인으로 해석한다.
          - 관측과 해석을 구분하고, 필요한 경우 최소 구조 수정과 재검증 범위를 제안한다.
          - planning_quality_failure이면 실패 artifact의 추가 사용자 시청을 중단하고 영향을 받은 selection·body lock·Cold open·Step 9 판정을 재개방한다.
          - 전편 재생성 전에 실패 가설 하나를 독립 검증할 수 있으면 그 가설에 필요한 smallest-sufficient review artifact를 만들고, 해당 UAT 전에는 새 전편 rough cut이나 AI 최종 PASS를 만들지 않는다.
      - 단계: 최종 공동 확정
        하는_일:
          - AI가 전문 판정 evidence, rough cut 관찰, 사용자 반응, 남은 불확실성을 정리해 이 영상의 PASS/FAIL 권고를 제시한다.
          - 최종 제작 진행 여부의 의사결정은 사용자에게 남긴다.
    판정_분리:
      - current truth·공정 위반이 남음: harness_failure
      - 공정은 지켰지만 영상이 약함: planning_quality_failure
      - 최소 제작 가능 수준 이상: pass
    통과_조건:
      - 실제 review rough cut이 재생 가능하고 사용자가 시청자 체감 관측을 남겼다.
      - AI가 그 관측을 구조 문제로 사후 해석하고 evidence와 함께 PASS/FAIL 권고를 제시했다.
      - 사용자가 최종 제작 진행 여부를 확정했다.
    판정자: AI/harness + 사용자 최종 의사결정
