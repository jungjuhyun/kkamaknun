# 1화 기획 공정 정의.
# plans/EP1_PLANNING_RELIABILITY_POC.md 의 실행 체크리스트 12단계를 그대로 옮긴 것이다.
# 진행 상태는 STATE.json 이 owner. 이 파일은 단계·검수 기준·통과 조건·최대 수정 횟수만 정의한다.
# 미완료 선행 단계를 건너뛰지 않는다. 최대 수정 횟수를 넘기면 다음 단계로 가지 않고 사용자에게 보고하고 멈춘다.
# 잠금 문장·확보/미확보 자료는 COMMON_RULES.json / EP1_LOCK.json 이 owner.

공정: ep1_planning_reliability_poc
기준일: 2026-09-02

단계:
  - 번호: 1
    이름: STATE checkpoint 반영
    하는_일: 이번 실제 실패와 현재 POC 위치를 STATE.md에 반영한다.
    통과_조건: STATE.md에 실패 목록과 활성 계획 포인터가 있다.
    판정자: AI
    최대_수정_횟수: 1

  - 번호: 2
    이름: 새 채팅으로 전환
    하는_일: 저장소 checkpoint 반영 뒤 새 채팅에서 시작한다.
    통과_조건: 새 채팅이 STATE.md → 필요한 문서 순으로 시작했다.
    판정자: 사용자
    최대_수정_횟수: 0

  - 번호: 3
    이름: RUN CONTRACT 복원·잠금
    하는_일: 새 규칙을 만들지 않고 잠금 파일(COMMON_RULES.json + EP1_LOCK.json)을 그대로 복원한다.
    검수_기준:
      - 잠금 문장 A/B가 원문 그대로다.
      - 확보한 자료 / 확보하지 못한 자료 목록이 잠금 파일과 같다.
      - 시뮬레이션 허용 범위가 잠금 파일과 같다.
    통과_조건: 잠금 파일과 다른 점이 0건.
    판정자: AI + check_draft.py
    최대_수정_횟수: 1

  - 번호: 4
    이름: 1화 가상 완성본 1차 작성
    하는_일: 가상 촬영본이 이미 존재한다고 가정하고 처음부터 끝까지 구체적으로 쓴다.
    검수_기준:
      - 빈칸형 기획("[촬영 후 결정]", "[좋은 장면이 나오면]", "[실제 반응이 있다면]")을 쓰지 않는다.
      - 출력 형식은 "클립화면 | 나레이션" 표다. 클립화면은 실제로 어떤 화면이 보이는지, 나레이션은 현장음·나레이션·무음 중 실제 들어갈 내용을 구체적으로 쓴다.
      - 성공/실패/부분 이해/오해/반응을 AI가 구체적으로 설정한다. 목적은 결과 예측이 아니라 촬영 전 시뮬레이션이다.
      - 외부 사실(유튜브 플랫폼 지침 등)을 쓰면 웹으로 확인한 뒤 쓴다.
    기획_HARD_GOALS:
      - 클릭할 이유가 있어야 한다.
      - 초반부터 계속 볼 이유가 있어야 한다.
      - 중간에 계속 볼 이유가 갱신되어야 한다.
      - A+B가 실제 사건을 특별하게 만들어야 한다.
      - C가 마지막 설명이 아니라 시청 경험에서 발생해야 한다.
      - 영상 전체가 향하는 콘텐츠 각이 있어야 한다.
      - 사용자라는 인물이 사건·판단·실수·발견 속에서 드러나야 한다.
      - 다 본 뒤 다음 영상을 보고 싶은 이유가 남아야 한다.
      - 화면이 이미 말하는 내용을 나레이션이 중복 설명하지 않아야 한다.
      - 단순한 "일본어 청해 테스트 사례 모음"의 반복으로 끝나면 안 된다.
      - 조회수·알고리즘 선택 보장을 주장하지 않되, 조사·구조·패키징·시청 흐름으로 YouTube 경쟁력을 높인다.
    통과_조건: 표 형식으로 처음부터 끝까지 작성됐고 빈칸형 문구가 0건.
    판정자: AI
    최대_수정_횟수: 1

  - 번호: 5
    이름: HARD VALIDATION
    하는_일: 사용자에게 공개하기 전에 current truth 위반과 명백한 사실 오류만 검사한다. 재미는 평가하지 않는다.
    검수_기준:
      - A/B/C 임의 변경
      - 자막 본문을 실제 확보했다고 허위 주장
      - 가상 장면을 실제 촬영 사실로 서술
      - 이미 존재하는 촬영물이 없다고 서술
      - 채택된 촬영 프로토콜을 새 제안처럼 변경
      - 실제 자료보다 강한 사실 주장
      - current owner와 충돌
      - 현재 요청과 무관한 2화·장면 수집기 등으로 이탈
    통과_조건: 위 8항목 0건. check_draft.py PASS. 하나라도 있으면 HARD FAIL이며 RED TEAM으로 넘어가지 않는다.
    판정자: check_draft.py + AI
    최대_수정_횟수: 2

  - 번호: 6
    이름: 기획 RED TEAM 1차
    하는_일: HARD PASS 후 초안을 처음 보는 경쟁 영상처럼 공격한다.
    검수_기준:
      시청자_견인:
        - 제목/썸네일을 봤다고 가정했을 때 왜 클릭하는가?
        - 첫 장면부터 왜 계속 보는가?
        - 각 주요 장면 뒤에 "다음은 왜 보지?"에 답이 있는가?
        - 결과 범위가 너무 예상 가능하지 않은가?
        - 같은 기능의 사례가 반복되지 않는가?
      ABC_콘텐츠_각:
        - A의 맥락이 자기소개가 아니라 사건을 특별하게 만드는가?
        - B가 단순 행동이 아니라 사건을 발생시키는가?
        - A+B가 이 영상만의 힘을 만드는가?
        - C가 마지막 설명 때문에 생기는 게 아니라 영상을 보는 동안 발생하는가?
        - 영상 전체가 가장 강한 콘텐츠 각을 향해 가는가?
      YouTube_플랫폼_경쟁력:
        - 제목/썸네일의 약속과 실제 첫 구간이 맞물리는가?
        - 초반 이후 시청 이유가 한 가지 결과 공개에만 의존하지 않는가?
        - 장면마다 시청자의 판단·기대·의문이 바뀌는가?
        - 불필요한 설명과 동일 기능 반복 때문에 이탈 구간이 생기지 않는가?
        - 영상 종료 후 다음 콘텐츠를 볼 이유가 자연스럽게 남는가?
      사람_구독:
        - 영상 주제보다 사용자라는 사람이 기억되는가?
        - 선택·오판·발견·반응이 실제 인물성을 드러내는가?
        - 시청자에게 "다음에 이 사람이 무엇을 할까?"라는 궁금증이 생기는가?
      화면:
        - 화면으로 이미 알 수 있는데 다시 설명하는 나레이션이 없는가?
        - 정보 설명보다 사건을 직접 보여주는가?
        - 구조표만 읽어도 머릿속에서 실제 영상이 재생되는가?
    통과_조건: >
      항목별로 PASS / WEAK / FAIL을 기록한다
      (사실/가정 경계, A/B 유지, 초반 견인, 중간 엔진, C, 콘텐츠 각, 구독 이유, 화면 시각화).
      FAIL이나 핵심 WEAK가 있으면 완성본으로 공개하지 않는다.
    판정자: AI
    최대_수정_횟수: 0

  - 번호: 7
    이름: FAIL / WEAK 항목만 수리
    하는_일: 전체 기획을 습관적으로 처음부터 다시 만들지 않는다. 실패한 기능만 수정한다.
    통과_조건: 수정 후 HARD VALIDATION(5단계 기준)을 다시 통과했다.
    판정자: check_draft.py + AI
    최대_수정_횟수: 1

  - 번호: 8
    이름: HARD VALIDATION 재검증 + RED TEAM 2차
    하는_일: 수리본을 한 번 더 공격한다. PLAYBOOK의 "한 번 재공격"이 이 단계다.
    통과_조건:
      - HARD VALIDATION: PASS
      - 핵심 시청자 견인 항목: PASS
      - 콘텐츠 각: PASS
      - C: PASS
      - 사실/가정 경계: PASS
      - 인물/후속 시청 이유: PASS
      - 화면 시각화: PASS
    판정자: AI
    최대_수정_횟수: 1
    미통과시: 7단계로 한 번만 되돌아간다. 그래도 통과하지 못하면 사용자에게 보고하고 멈춘다.

  - 번호: 9
    이름: 사용자에게 최종안 공개
    하는_일: 신뢰 검증을 위해 3가지를 함께 공개한다.
    검수_기준:
      - A. 최종 가상 완성본 ("클립화면 | 나레이션" 중심)
      - B. 최종 기획 잠금 (A / B / 왜 봐야 하는가 / C / 콘텐츠 각 / 다음 편을 볼 이유)
      - C. 검증 결과 (HARD CHECK, RED TEAM 1차, 수정한 지점, RED TEAM 2차)
    통과_조건: 3가지가 모두 있고, check_draft.py PASS 줄이 답변에 붙어 있다. PASS 줄이 없는 초안은 사용자가 읽지 않는다.
    판정자: AI
    최대_수정_횟수: 1
    비고: POC가 안정화된 뒤에는 매번 검수 로그 전체를 보여줄 필요는 없다.

  - 번호: 10
    이름: 사용자 품질 판정
    하는_일: 사용자가 판단한다. 내부 오류 검수가 아니라 "실제로 찍어보고 싶은가?", "내가 시청자라도 계속 볼 것 같은가?"다.
    판정_분리:
      - 공정 오류가 남음 → 실행 신뢰성 실패
      - 공정은 지켰지만 영상이 평범함 → 기획 품질 실패
      - 둘 다 통과 → 다음 단계 진행
    통과_조건: 사용자가 둘 다 통과로 판정했다. 재미·구조 품질은 기계로 판정하지 않는다.
    판정자: 사용자
    최대_수정_횟수: 0

  - 번호: 11
    이름: 새 채팅 복원 시험
    하는_일: 중요 checkpoint가 저장소에 반영된 뒤 새 채팅에서 bootstrap 한다.
    검수_기준:
      - 현재 POC 목적
      - locked A/B/C
      - 가상 완성본의 의미
      - 기존 실제 촬영물이 존재한다는 사실
      - 확보하지 못한 자료를 확보했다고 하지 않아야 한다는 상태
      - 현재 체크리스트 단계
    통과_조건: 사용자가 프로젝트 맥락을 다시 설명하지 않고도 위 6개가 복원됐다. 다시 설명해야 하면 복원 실패.
    판정자: 사용자
    최대_수정_횟수: 0

  - 번호: 12
    이름: 자동 runner 구현 여부 결정
    하는_일: 이 수동 POC 결과 뒤에만 결정한다. 특정 framework나 다중 agent 구조를 미리 고정하지 않는다.
    결과_분기:
      A: 수동 체크리스트만으로 충분히 안정적 → runner를 만들지 않는다.
      B: 기획 품질은 충분하지만 hard error가 반복 → locked run state + deterministic validator부터 최소 자동화한다.
      C: hard error는 없어졌지만 기획 자체가 계속 평범함 → runner 문제가 아니다. 기획 모델·외부 조사·평가 rubric·모델 선택 문제를 다시 본다.
    통과_조건: A/B/C 중 하나로 기록됐다.
    판정자: 사용자
    최대_수정_횟수: 0
