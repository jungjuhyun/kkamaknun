[project]
name = "scene-collector"
version = "0.1.0"
description = "까막눈 애니 표현 장면 수집기"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "instructor[google-genai]==1.15.4",
    "nadeshiko-sdk==2.3.7",
    "pydantic",
    "pydantic-settings",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "ai_live: 실제 AI provider 계정과 API 사용량이 필요한 연결 시험",
    "nadeshiko_live: 실제 Nadeshiko 계정과 API 사용량이 필요한 연결 시험",
    "search_live: 실제 AI와 Nadeshiko API 사용량이 필요한 검색 품질 시험",
    "surface_live: 실제 Nadeshiko 검색과 로컬 표면형 필터 비교 시험",
    "media_live: 실제 Nadeshiko 작품 metadata와 media filter 검색 시험",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
