[project]
name = "scene-collector"
version = "0.1.0"
description = "까막눈 애니 표현 장면 수집기"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
